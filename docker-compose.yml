name: logi-scope

x-project-volumes: &project-volumes
  # Mount only development inputs; never expose the host .env or .git.
  - ./src:/home/developer/work/logi-scope/src
  - ./tests:/home/developer/work/logi-scope/tests
  - ./scripts:/home/developer/work/logi-scope/scripts
  - ./migrations:/home/developer/work/logi-scope/migrations
  - ./seed:/home/developer/work/logi-scope/seed
  - ./docs:/home/developer/work/logi-scope/docs
  - ./.agents:/home/developer/work/logi-scope/.agents
  - ./.github:/home/developer/work/logi-scope/.github
  - ./artifacts:/home/developer/work/logi-scope/artifacts
  - ./pyproject.toml:/home/developer/work/logi-scope/pyproject.toml
  - ./uv.lock:/home/developer/work/logi-scope/uv.lock
  - ./alembic.ini:/home/developer/work/logi-scope/alembic.ini
  - ./README.md:/home/developer/work/logi-scope/README.md
  - ./AGENTS.md:/home/developer/work/logi-scope/AGENTS.md
  - ./.env.example:/home/developer/work/logi-scope/.env.example
  - embedding_cache:/home/developer/.cache/huggingface

services:
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    volumes:
      - ./frontend:/home/developer/work/logi-scope/frontend
      - frontend_node_modules:/home/developer/work/logi-scope/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"

  app:
    build:
      context: .
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    volumes: *project-volumes
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-logiscope-qwen30-probe}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-300}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1200}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      AGENT_MAX_LLM_CALLS: ${AGENT_MAX_LLM_CALLS:-8}
      AGENT_MAX_TOOL_ATTEMPTS: ${AGENT_MAX_TOOL_ATTEMPTS:-12}
      AGENT_TOTAL_TIMEOUT: ${AGENT_TOTAL_TIMEOUT:-900}
      DATABASE_PASSWORD: ${POSTGRES_READER_PASSWORD:?Set POSTGRES_READER_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  updates:
    profiles: ["updates"]
    build:
      context: .
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    volumes: *project-volumes
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      UPDATE_DATABASE_PASSWORD: ${POSTGRES_UPDATE_PASSWORD:?Set POSTGRES_UPDATE_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "--locked", "uvicorn", "logi_scope.updates_api:app", "--host", "0.0.0.0", "--port", "8001"]


  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    environment:
      POSTGRES_DB: logi_scope
      POSTGRES_USER: logi_scope_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 uses a versioned PGDATA under this directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logi_scope_admin -d logi_scope"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Invoked explicitly with `docker compose run --rm manage ...`.
  # Administrative credentials never enter the runtime app service.
  manage:
    profiles: ["management"]
    build:
      context: .
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    volumes: *project-volumes
    environment:
      UPDATE_DATABASE_PASSWORD: ${POSTGRES_UPDATE_PASSWORD:?Set POSTGRES_UPDATE_PASSWORD in .env}
      ADMIN_DATABASE_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      INGEST_DATABASE_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?Set POSTGRES_INGEST_PASSWORD in .env}
      DATABASE_PASSWORD: ${POSTGRES_READER_PASSWORD:?Set POSTGRES_READER_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["uv", "run", "--locked", "python", "-m", "logi_scope.manage"]

  ingest:
    profiles: ["management"]
    build:
      context: .
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    volumes: *project-volumes
    environment:
      INGEST_DATABASE_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?Set POSTGRES_INGEST_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["uv", "run", "--locked", "python", "-m", "logi_scope.rag.ingest"]

volumes:
  frontend_node_modules:
  postgres_data:
  embedding_cache:
