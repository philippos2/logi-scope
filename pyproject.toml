[project]
name = "logi-scope"
version = "0.3.0"
description = "Japanese logistics Tool-calling Agent Loop demo"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "sentence-transformers>=5.7,<6",
    "torch>=2.7,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logi_scope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires the real PostgreSQL database and management credentials"]

# Linux containers use CPU wheels; keep the GPU available for the host LLM.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py313"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "migrations/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
